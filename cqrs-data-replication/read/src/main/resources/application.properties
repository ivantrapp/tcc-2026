spring.application.name=read

spring.datasource.url=jdbc:postgresql://localhost:5455/crm_read
spring.datasource.username=crm
spring.datasource.password=crm
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true

spring.flyway.enabled=false

# WAL replication subscription (overridden by docker-compose env vars in Docker)
replication.write.host=db-write
replication.write.port=5432
replication.write.name=crm_write
replication.user=replicator
replication.password=replicator
replication.publication=crm_publication
replication.subscription=crm_subscription

server.port=8081
