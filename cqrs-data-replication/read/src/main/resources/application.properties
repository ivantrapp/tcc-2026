spring.application.name=read

spring.datasource.url=jdbc:postgresql://localhost:5455/crm_read
spring.datasource.username=crm
spring.datasource.password=crm
spring.datasource.driver-class-name=org.postgresql.Driver
# Mesmo pool em todos os servicos das duas arquiteturas (comparacao justa).
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Padrao do Tomcat e 8192; 10000 VUs com keep-alive passam disso.
server.tomcat.max-connections=20000

spring.flyway.enabled=false

# WAL replication — subscriptions criadas automaticamente pelo SubscriptionConfig
replication.user=replicator
replication.password=replicator

replication.staff.host=localhost
replication.staff.port=5457
replication.staff.name=crm_staff

replication.customer.host=localhost
replication.customer.port=5458
replication.customer.name=crm_customer

replication.wallet.host=localhost
replication.wallet.port=5459
replication.wallet.name=crm_wallet

server.port=8081

# Mesma configuracao de log do event sourcing.
logging.level.root=WARN
logging.level.com.cqrs=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [read] %logger{36} - %msg%n
