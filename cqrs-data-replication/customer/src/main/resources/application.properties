spring.application.name=customer

spring.datasource.url=jdbc:postgresql://localhost:5458/crm_customer
spring.datasource.username=crm
spring.datasource.password=crm
spring.datasource.driver-class-name=org.postgresql.Driver
# Mesmo pool em todos os servicos das duas arquiteturas (comparacao justa).
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Padrao do Tomcat e 8192; 10000 VUs com keep-alive passam disso.
server.tomcat.max-connections=20000

spring.flyway.enabled=false

services.read.base-url=http://localhost:8081

server.port=8083

# Mesma configuracao de log do event sourcing.
logging.level.root=WARN
logging.level.com.cqrs=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [customer] %logger{36} - %msg%n
