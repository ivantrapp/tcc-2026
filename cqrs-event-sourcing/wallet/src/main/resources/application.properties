spring.application.name=wallet

spring.datasource.url=jdbc:postgresql://localhost:5443/crm_wallet
spring.datasource.username=crm
spring.datasource.password=crm
spring.datasource.driver-class-name=org.postgresql.Driver
# Mesmo pool em todos os servicos das duas arquiteturas (comparacao justa).
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Padrao do Tomcat e 8192; 10000 VUs com keep-alive passam disso.
server.tomcat.max-connections=20000

spring.flyway.enabled=false

services.read.base-url=http://localhost:8081

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.requested-heartbeat=10
# Limite de canais para publicar: com checkout-timeout o cache vira teto e a
# publicacao espera um canal livre em vez de falhar com "channelMax limit is reached".
spring.rabbitmq.cache.channel.size=200
spring.rabbitmq.cache.channel.checkout-timeout=5000


server.port=8084

logging.level.root=WARN
logging.level.com.cqrs=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [wallet] %logger{36} - %msg%n
