spring.application.name=customer

app.db-schema=customer

spring.datasource.url=jdbc:postgresql://localhost:5440/crm_write?currentSchema=customer
spring.datasource.username=crm
spring.datasource.password=crm
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=customer
spring.jpa.open-in-view=false

spring.flyway.enabled=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

services.read.base-url=http://localhost:8081

server.port=8083

logging.level.root=WARN
logging.level.com.cqrs=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [customer] %logger{36} - %msg%n
