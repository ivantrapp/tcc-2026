spring.application.name=read

spring.datasource.url=jdbc:postgresql://localhost:5440/crm_read
spring.datasource.username=crm
spring.datasource.password=crm
spring.datasource.driver-class-name=org.postgresql.Driver
# Mesmo pool em todos os servicos das duas arquiteturas (comparacao justa).
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Padrao do Tomcat e 8192; 10000 VUs com keep-alive passam disso.
server.tomcat.max-connections=20000

spring.flyway.enabled=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.requested-heartbeat=10

server.port=8081

logging.level.root=WARN
logging.level.com.cqrs=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [read] %logger{36} - %msg%n
